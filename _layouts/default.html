      var randomWeekendActivities = [
        {title: "knit & crochet", url: '#'},

        {title: "casually hike", url: '#'},
        {title: "do tissue art in random bathrooms", url: '#'},

        {title: "work on my secret business plan", url: '#'},

        var randomWeekendIndex = Math.floor(Math.random() * randomWeekendActivities.length - 1) + 1;
        weekendSelector.innerText = randomWeekendActivities[randomWeekendIndex].title;
        weekendSelector.title = randomWeekendActivities[randomWeekendIndex].title;
